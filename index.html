<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3">
<title>Old People Collection</title>
<link rel="stylesheet" href="shared/theme.css?v=2">
<style>
  body { display: flex; flex-direction: column; align-items: center; padding: 24px 16px 60px; }
  .hub-frame { width: 100%; max-width: 760px; }
  .hub-felt { padding: 40px 24px; text-align: center; }
  header.hub-header { margin-bottom: 30px; }
  .tagline { color: var(--cream); opacity: 0.85; margin-top: 10px; font-size: 1.05rem; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
  .tile {
    display: block; text-decoration: none;
    background: var(--cream); color: var(--ink);
    border-radius: 14px; padding: 28px 16px;
    box-shadow: 0 6px 0 var(--wood-dark);
    font-family: var(--font-display); font-weight: 700; font-size: 1.3rem;
  }
  .tile:hover { filter: brightness(1.05); }
  .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--wood-dark); }
  .tile .icon { font-size: 2.4rem; display: block; margin-bottom: 10px; }
  .tile.soon { opacity: 0.5; cursor: default; pointer-events: none; }
  .tile .sub { display: block; font-family: var(--font-body); font-weight: 400; font-size: 0.9rem; margin-top: 6px; color: var(--ink-soft); }
  footer.hub-footer { margin-top: 34px; font-size: 0.85rem; opacity: 0.75; }
</style>
</head>
<body>
  <div class="hub-frame wood-frame">
    <div class="hub-felt felt">
      <header class="hub-header">
        <span class="brass-plate">Old People Collection</span>
        <p class="tagline">Simple card &amp; puzzle games. No ads. No pop-ups. Nothing to click except the game.</p>
      </header>

      <div class="tiles">
        <a class="tile" href="games/solitaire/index.html">
          <span class="icon" aria-hidden="true">♠</span>
          Solitaire
          <span class="sub">Classic Klondike</span>
        </a>
        <a class="tile" href="games/mahjong/index.html">
          <span class="icon" aria-hidden="true">🎴</span>
          Mahjong
          <span class="sub">Match the tiles</span>
        </a>
        <a class="tile" href="games/minesweeper/index.html">
          <span class="icon" aria-hidden="true">💣</span>
          Minesweeper
          <span class="sub">Classic logic puzzle</span>
        </a>
      </div>
    </div>
  </div>
  <footer class="hub-footer">This app makes no network requests and shows no advertising.</footer>
</body>
</html>
